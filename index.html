<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAMAR-MD Pairing</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Tahoma'; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #25D366; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #2a2a2a; color: #fff; font-size: 16px; }
        button { background: #25D366; color: #000; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; }
        #codeBox { font-size: 24px; letter-spacing: 3px; background: #000; padding: 15px; margin-top: 15px; border-radius: 8px; color: #25D366; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>DAMAR-MD</h2>
        <p>دخل النمرة ديالك بالكود ديال البلد</p>
        <input type="text" id="number" placeholder="مثال: 212633226499" />
        <select id="server">
            <option value="server1">السيرفر 1</option>
        </select>
        <button id="getCodeBtn" onclick="getCode()">جيب كود الربط</button>
        <div id="codeBox"></div>
        <p style="font-size: 12px; color: #aaa;">الكود صالح 20 ثانية فقط</p>
    </div>

    <script>
        const API_URL = 'https://damar-api-production.up.railway.app'; // رابط Railway ديالك

        async function getCode() {
            const number = document.getElementById('number').value;
            const server = document.getElementById('server').value;
            const btn = document.getElementById('getCodeBtn');
            const codeBox = document.getElementById('codeBox');

            if (!number) return alert('دخل النمرة');

            btn.disabled = true;
            btn.innerText = 'كنجيب الكود...';
            codeBox.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, server })
                });
                const data = await res.json();
                
                if (data.code) {
                    codeBox.innerText = data.code;
                    codeBox.style.display = 'block';
                    alert('الكود: ' + data.code + '\nدخلو للواتساب دابا فـ الأجهزة المرتبطة');
                } else {
                    alert('خطأ: ' + data.message);
                }
            } catch (e) {
                alert('خطأ في الاتصال بالسيرفر: ' + e.message);
            }
            btn.disabled = false;
            btn.innerText = 'جيب كود الربط';
        }
    </script>
</body>
</html>
