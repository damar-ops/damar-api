<script>
const API_URL = "https://damar-api-production.up.railway.app/code" 
const OWNER_NUMBER = "212633226499" // <-- حط هنا رقمك ديال الواتساب
const audio = document.getElementById('welcomeAudio');
let audioStarted = false;

// نعمرو السيرفرات تلقائي من 1 حتى 50
const serverSelect = document.getElementById('server');
for(let i = 1; i <= 50; i++){
  let option = document.createElement('option');
  option.value = `server${i}`;
  option.text = `السيرفر ${i}`;
  serverSelect.appendChild(option);
}

window.addEventListener('load', startAudio);
document.addEventListener('click', startAudio, {once: true});
document.addEventListener('touchstart', startAudio, {once: true});

function startAudio(){
  if(audioStarted) return;
  audioStarted = true;
  audio.play().catch(err=>{ console.log("استنى المستخدم يضغط", err); });
}

async function generateCode(){
  const number = document.getElementById('number').value.trim();
  const server = document.getElementById('server').value;
  const btn = document.querySelector('.btn');
  const errorBox = document.getElementById('errorBox');
  errorBox.innerText = "";
  
  if(number.length < 10 || !number.startsWith('212')){
    alert('دخل النمرة صحيحة ا خويا. خاص تبدا ب 212');
    return;
  }

  btn.disabled = true;
  btn.innerText = 'كنجيب الكود...';
  document.getElementById('resultBox').style.display = 'none';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Origin': 'https://damar-ops.github.io' // مهم باش CORS يخدم
      },
      body: JSON.stringify({ 
        number, 
        server,
        owner: OWNER_NUMBER, // <-- زدنا هادي باش يوصلك الاشعار
        botName: "DAMAR-MD"
      })
    });

    const data = await res.json(); // سهلناها شوية

    if(!res.ok) throw new Error(data.message || 'وقع خطأ');

    document.getElementById('codeOutput').innerText = data.code;
    document.getElementById('resultBox').style.display = 'block';
    alert(`✅ الكود: ${data.code}\nتصيفط حتى للواتساب ديال المطور`);

  } catch(err) {
    errorBox.innerText = "❌ " + err.message;
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerText = 'جيب كود الربط 🔑';
  }
}
</script>
