<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10051d">
<title>DAMAR-MD - كود الربط</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  color: white;
  background: linear-gradient(135deg, #0f0f0f, #1a0033);
}

.container {
  width: 100%;
  max-width: 370px;
  padding: 18px;
  background: #111;
  border: 2px solid #a855f7;
  border-radius: 17px;
  box-shadow: 0 0 25px #a855f744;
}

.logo-wrap {
  width: 78px;
  height: 78px;
  margin: 0 auto 12px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(#00ff88, #00aaff, #a855f7, #00ff88);
  animation: spin 5s linear infinite;
}

.logo {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 3px solid #111;
  background: #111 url("https://files.catbox.moe/bxx6uh.jpg") center/cover no-repeat;
  animation: counterspin 5s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes counterspin {
  to { transform: rotate(-360deg); }
}

h1 {
  color: #c084fc;
  text-align: center;
  font-size: 26px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #bbb;
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 18px;
}

.card {
  background: #1a1a1a;
  border: 1px solid #a855f7;
  border-radius: 12px;
  padding: 15px;
}

label {
  display: block;
  margin: 12px 0 7px;
  color: #ddd;
  font-size: 13px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #222;
  color: white;
  outline: none;
  font-size: 16px;
  direction: ltr;
  text-align: left;
}

input:focus {
  border-color: #a855f7;
  box-shadow: 0 0 8px #a855f755;
}

.btn {
  width: 100%;
  display: block;
  border: 0;
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg, #a855f7, #6d28d9);
}

.btn:disabled {
  opacity: .6;
  cursor: wait;
}

.btn.whatsapp {
  background: linear-gradient(135deg, #25d366, #128c7e);
}

.btn.group {
  background: linear-gradient(135deg, #ff00cc, #3333ff);
}

.result {
  display: none;
  margin-top: 15px;
  padding: 13px;
  border: 1px dashed #a855f7;
  border-radius: 9px;
  background: #0d0d0d;
  text-align: center;
}

.result h3 {
  color: #c084fc;
  font-size: 15px;
  margin-bottom: 10px;
}

.code {
  direction: ltr;
  user-select: text;
  overflow-wrap: anywhere;
  font-size: 24px;
  letter-spacing: 3px;
  font-weight: 800;
  padding: 12px 5px;
  border-radius: 7px;
  background: #000;
  color: #00ff88;
}

.message {
  margin-top: 9px;
  color: #ddd;
  font-size: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.error {
  color: #ff7070;
}

.success {
  color: #00ff88;
}

.server-status {
  text-align: center;
  margin-top: 15px;
  color: #aaa;
  font-size: 11px;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-left: 5px;
  border-radius: 50%;
  background: #999;
}

.footer {
  margin-top: 15px;
  text-align: center;
  color: #aaa;
  font-size: 11px;
  line-height: 1.9;
}

.footer a {
  color: #00aaff;
  text-decoration: none;
}

button:focus-visible, a:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}
</style>
</head>

<body>

<audio id="welcomeAudio"
  src="https://files.catbox.moe/5490j1.opus"
  preload="none" loop></audio>

<main class="container">

  <div class="logo-wrap">
    <div class="logo"></div>
  </div>

  <h1>DAMAR-MD</h1>

  <p class="subtitle">
    جيب كود الربط وربط البوت ديالك بواتساب
  </p>

  <section class="card">

    <form id="pairForm">
      <label for="number">📱 نمرة واتساب مع مفتاح الدولة</label>

      <input
        type="tel"
        id="number"
        name="number"
        placeholder="مثال: 212633226499"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="20"
        required
      >

      <button class="btn" id="pairButton" type="submit">
        🔑 جيب كود الربط
      </button>
    </form>

    <div id="resultBox" class="result" aria-live="polite">
      <h3 id="resultTitle">نتيجة الطلب</h3>
      <div id="codeOutput" class="code" hidden></div>
      <p id="messageOutput" class="message"></p>
      <button id="copyButton" class="btn" type="button" hidden>
        📋 نسخ الكود
      </button>
    </div>

    <a class="btn group"
      href="https://chat.whatsapp.com/LGwM4Mvbt6JB3vgdnDliAn?s=cl&p=a&ilr=1"
      target="_blank" rel="noopener noreferrer">
      👥 دخول المجموعة
    </a>

    <a class="btn whatsapp"
      href="https://wa.me/212633226499"
      target="_blank" rel="noopener noreferrer">
      📞 تواصل مع المطور
    </a>

    <div class="server-status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">كنتحققو من حالة API...</span>
    </div>

  </section>

  <footer class="footer">
    المطور:
    <a href="https://www.facebook.com/profile.php?id=61591783185803"
       target="_blank" rel="noopener noreferrer">DAMAR-MD</a>
    <p>© 2026 DAMAR-MD</p>
  </footer>

</main>

<script>
"use strict";

/*
 * رابط Railway الجديد.
 * خاص هاد الخدمة تكون هي نفسها اللي فيها endpoint /api/pair.
 */
const API_BASE = "https://damar-api-production-d258.up.railway.app";
const PAIR_URL = API_BASE + "/api/pair";
const STATUS_URL = API_BASE + "/api/status";

const form = document.getElementById("pairForm");
const numberInput = document.getElementById("number");
const pairButton = document.getElementById("pairButton");
const resultBox = document.getElementById("resultBox");
const resultTitle = document.getElementById("resultTitle");
const codeOutput = document.getElementById("codeOutput");
const messageOutput = document.getElementById("messageOutput");
const copyButton = document.getElementById("copyButton");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const audio = document.getElementById("welcomeAudio");

let currentCode = "";

function showMessage(title, message, type = "") {
  resultBox.style.display = "block";
  resultTitle.textContent = title;
  messageOutput.textContent = message;
  messageOutput.className = "message " + type;
  codeOutput.hidden = true;
  copyButton.hidden = true;
  currentCode = "";
}

function normalizeNumber(value) {
  return value.replace(/\D/g, "");
}

async function readResponse(response) {
  const text = await response.text();

  let data;
  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    data = { message: text };
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      data.message ||
      "السيرفر رجع HTTP " + response.status
    );
  }

  if (!data || typeof data !== "object") {
    throw new Error("جواب API ماشي بالصيغة المتوقعة.");
  }

  return data;
}

/*
 * فحص API غير للتشخيص.
 * هاد الفحص ما كيولّدش كود الربط.
 */
async function checkAPI() {
  try {
    const response = await fetch(STATUS_URL, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    statusDot.style.background = "#00ff88";
    statusText.textContent = "API كيرد على الطلبات";
  } catch (error) {
    statusDot.style.background = "#ff5555";
    statusText.textContent = "تعذر فحص API";
    console.error("API status check failed:", error);
  }
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const number = normalizeNumber(numberInput.value);

  if (number.length < 8 || number.length > 15) {
    showMessage(
      "❌ النمرة غير صحيحة",
      "دخل رقم واتساب كامل مع مفتاح الدولة، بلا + ولا مسافات.",
      "error"
    );
    return;
  }

  pairButton.disabled = true;
  pairButton.textContent = "⏳ كنطلبو كود الربط...";
  showMessage("جاري الطلب", "تسنى حتى يجاوب السيرفر.");

  try {
    // الصوت كيبدا غير من بعد تفاعل المستخدم.
    audio.play().catch(() => {});

    const response = await fetch(PAIR_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({ number }),
      cache: "no-store"
    });

    const data = await readResponse(response);

    console.log("Pair API response:", data);

    /*
     * كنقبلو بعض الأسماء الشائعة للكود.
     * خاصها تبقى مطابقة للاسم اللي كيرجع فعلياً index.js.
     */
    const code =
      data.code ??
      data.pairingCode ??
      data.pairing_code ??
      data.data?.code ??
      data.data?.pairingCode ??
      data.result?.code ??
      "";

    if (typeof code === "string" && code.trim()) {
      currentCode = code.trim();
      resultBox.style.display = "block";
      resultTitle.textContent = "✅ جواب السيرفر فيه كود";
      codeOutput.textContent = currentCode;
      codeOutput.hidden = false;
      messageOutput.textContent =
        "تبع تعليمات واتساب لإدخال كود الربط. ما تشاركش الكود مع أي شخص.";
      messageOutput.className = "message success";
      copyButton.hidden = false;
    } else {
      const details = data.message || data.error ||
        "السيرفر ما رجعش خانة كود معروفة.";

      showMessage(
        "⚠️ ما وصلناش الكود",
        String(details) +
        "\nجواب API:\n" +
        JSON.stringify(data, null, 2),
        "error"
      );
    }
  } catch (error) {
    console.error("Pair request failed:", error);

    let message = error.message || "وقع خطأ غير معروف.";

    if (error instanceof TypeError) {
      message =
        "ما قدرناش نتاصلو بـ API. تأكد من رابط Railway، وحالة الخدمة، وإعدادات CORS. شوف Console ديال المتصفح وسجلات Railway.";
    }

    showMessage("❌ فشل طلب كود الربط", message, "error");
  } finally {
    pairButton.disabled = false;
    pairButton.textContent = "🔑 جيب كود الربط";
  }
});

copyButton.addEventListener("click", async function() {
  if (!currentCode) return;

  try {
    await navigator.clipboard.writeText(currentCode);
    messageOutput.textContent = "✅ تنسخ الكود. ما تشاركوش مع حتى واحد.";
    messageOutput.className = "message success";
  } catch {
    messageOutput.textContent =
      "ما قدرناش ننسخو تلقائياً. ضغط مطولاً على الكود ونسخو.";
    messageOutput.className = "message error";
  }
});

numberInput.addEventListener("input", function() {
  this.value = this.value.replace(/[^\d+\s()-]/g, "");
});

checkAPI();
</script>

</body>
</html>
