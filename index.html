<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAMAR-MD - جيب الكود ديال الربط</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif}
body{background:linear-gradient(135deg,#0f0f0f 0%,#1a0033 100%);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
.container{background:#111;border:2px solid #a855f7;border-radius:20px;padding:40px 30px;max-width:500px;width:100%;box-shadow:0 0 30px rgba(168,85,247,0.3);position:relative;animation: glow 4s infinite alternate}
@keyframes glow {
  0%{box-shadow:0 0 20px rgba(0,150,255,0.4)}
 33%{box-shadow:0 0 20px rgba(255,0,0,0.4)}
  66%{box-shadow:0 0 20px rgba(0,255,0,0.4)}
  100%{box-shadow:0 0 20px rgba(168,85,247,0.4)}
}

/* الدائرة بالصورة و الدوران اخضر ازرق */
.logo-wrap{width:110px;height:110px;margin:0 auto 15px;position:relative;display:flex;justify-content:center;align-items:center}
.logo-wrap::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  background: conic-gradient(from 0deg, #00ff88, #00aaff, #00ff88);
  animation: spin 3s linear infinite;
  z-index:0;
}
.logo{
  width:100px;height:100px;border-radius:50%;position:relative;z-index:1;
  background-image:url('https://files.catbox.moe/bxx6uh.jpg');
  background-size:cover;background-position:center;
  border:3px solid #111;
  animation: pulse 2s infinite alternate;
}
@keyframes spin{ to{transform:rotate(360deg)} }
@keyframes pulse{ from{transform:scale(1)} to{transform:scale(1.05)} }

h1{color:#a855f7;font-size:35px;text-align:center;margin-bottom:5px;font-weight:800;animation: colorCycle 5s infinite}
.subtitle{text-align:center;color:#ccc;margin-bottom:25px;font-size:14px;animation: colorCycle 5s infinite 0.5s}
@keyframes colorCycle{
 0%{color:#00aaff} 33%{color:#ff0000} 66%{color:#00ff88} 100%{color:#a855f7}
}

.card{background:#1a1a1a;padding:25px;border-radius:15px;margin-bottom:20px;border:1px solid transparent;animation: borderColor 6s infinite}
@keyframes borderColor{
 0%{border-color:#00aaff} 33%{border-color:#ff0000} 66%{border-color:#00ff88} 100%{border-color:#a855f7}
}

label{display:block;margin-bottom:8px;color:#ddd;font-weight:600}
input,select{width:100%;padding:14px;background:#222;border:1px solid #444;color:#fff;border-radius:10px;font-size:16px;margin-bottom:15px;outline:none;transition:0.3s}
input:focus,select:focus{border-color:#00aaff;box-shadow:0 0 10px rgba(0,170,255,0.4)}

.btn{width:100%;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;padding:15px;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;transition:0.3s;margin-bottom:10px}
.btn:hover{transform:scale(1.02);box-shadow:0 0 20px rgba(168,85,247,0.5)}
.btn.whatsapp{background:linear-gradient(135deg,#25D366,#128C7E)}
.btn.whatsapp:hover{box-shadow:0 0 20px rgba(37,211,102,0.5)}
.btn:disabled{background:#555;cursor:not-allowed}

.result{margin-top:20px;padding:15px;background:#0d0d0d;border:1px dashed #a855f7;border-radius:10px;text-align:center;display:none}
.result h3{color:#a855f7;margin-bottom:10px}
.code{font-size:24px;letter-spacing:3px;font-weight:800;color:#fff;background:#000;padding:10px;border-radius:8px}
.error{color:#ff5555;margin-top:10px;font-size:14px}

/* الفوتر الجديد */
.footer{text-align:center;margin-top:25px;font-size:14px;color:#aaa}
.footer a{color:#00aaff;text-decoration:none;font-weight:700;transition:0.3s}
.footer a:hover{color:#00ff88;text-decoration:underline}
.social{margin-top:10px;display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo"></div>
  </div>
  <h1>DAMAR-MD</h1>
  <p class="subtitle">جيب الكود ديال الربط وربط البوت ديالك</p>

  <div class="card">
    <label for="number">📱 النمرة ديال الواتساب</label>
    <input type="text" id="number" placeholder="مثال: 212633226499">

    <label for="server">🖥️ ختار السيرفر</label>
    <select id="server">
      <option value="server1">السيرفر 1 - المغرب 🇲🇦</option>
      <option value="server2">السيرفر 2 - فرنسا 🇫🇷</option>
      <option value="server3">السيرفر 3 - ألمانيا 🇩🇪</option>
      <option value="server4">السيرفر 4 - أمريكا 🇺🇸</option>
      <option value="server5">السيرفر 5 - كندا 🇨🇦</option>
    </select>

    <button class="btn" onclick="generateCode()">جيب كود الربط 🔑</button>
    <a href="https://wa.me/212633226499" target="_blank"><button class="btn whatsapp">📞 تواصل مع المطور فواتساب</button></a>

    <div class="result" id="resultBox">
      <h3>✅ هاهو الكود ديالك</h3>
      <div class="code" id="codeOutput">----</div>
      <p style="font-size:12px;color:#aaa;margin-top:8px">الكود تصيفط ليك فالواتساب دابا. دخلو فـ "ربط بجهاز"</p>
    </div>
    <p class="error" id="errorBox"></p>
  </div>

  <div class="footer">
    <p>حساب المطور البوت: <a href="https://www.facebook.com/profile.php?id=61591783185803" target="_blank">DAMAR-MD</a></p>
    <div class="social">
      <a href="https://www.facebook.com/profile.php?id=61591783185803" target="_blank">فيسبوك</a> | 
      <a href="https://wa.me/212633226499" target="_blank">واتساب</a>
    </div>
    <p style="font-size:12px;color:#666;margin-top:8px">© 2026 Powered By DAMAR</p>
  </div>
</div>

<script>
const API_URL = "https://damar-api-production.up.railway.app/code" 

async function generateCode(){
  const number = document.getElementById('number').value.trim();
  const server = document.getElementById('server').value;
  const btn = document.querySelector('.btn');
  const errorBox = document.getElementById('errorBox');
  errorBox.innerText = "";
  
  if(number.length < 10 || !number.startsWith('212')){
    alert('دخل النمرة صحيحة ا خويا. خاص تبدا ب 212');
    return;
  }

  btn.disabled = true;
  btn.innerText = 'كنجيب الكود...';
  document.getElementById('resultBox').style.display = 'none';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number, server })
    });

    const text = await res.text();
    let data;
    try {
        data = JSON.parse(text);
    } catch {
        throw new Error('السيرفر رجع خطأ. تأكد البوت خدام ف Railway');
    }

    if(!res.ok) throw new Error(data.message || 'وقع خطأ');

    document.getElementById('codeOutput').innerText = data.code;
    document.getElementById('resultBox').style.display = 'block';
    alert(`✅ الكود تصيفط للنمرة ${number} فالواتساب`);

  } catch(err) {
    errorBox.innerText = "❌ " + err.message;
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerText = 'جيب كود الربط 🔑';
  }
}
</script>
</body>
</html>
